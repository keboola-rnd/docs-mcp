# Nginx config for the keboola-docs-mcp Keboola data app.
#
# Traffic flow:  Client → Keboola proxy → Nginx (port 8888) → server.py (port 5000)
#
# Critical settings:
#   - `proxy_buffering off` on /mcp: required for SSE streaming.
#   - `/` returns 200 directly: handles Keboola's GET (startup probe) and POST
#     (wakeup check) without involving the app.
#   - `Host: 127.0.0.1:5000` is rewritten for proxied locations: the MCP SDK
#     has DNS-rebinding protection that 421s any Host outside its allowlist
#     (which is just localhost variants by default). Original host preserved
#     via X-Forwarded-Host.
#
# No auth — /mcp is intentionally public. The server-side Keboola Storage API
# token is held inside the app process and never exposed to clients.

server {
    listen 8888;
    server_name _;

    # Health check — return 200 for both GET (startup probe) and POST (wakeup check).
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"keboola-docs-mcp"}';
    }

    # MCP endpoint. Streaming-safe; no auth.
    location /mcp {
        proxy_pass http://127.0.0.1:5000/mcp;

        # Host rewrite — MCP SDK's DNS-rebinding protection rejects anything
        # outside its localhost allowlist. Original host preserved below.
        proxy_set_header Host "127.0.0.1:5000";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for MCP streamable-http (SSE).
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # MCP tool calls can take a while (AI service + network).
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Convenience route — server's own /healthz, useful for local dev.
    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        proxy_set_header Host "127.0.0.1:5000";
        proxy_set_header X-Forwarded-Host $host;
    }
}
