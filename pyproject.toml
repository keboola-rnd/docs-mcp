[project]
name = "keboola-docs-mcp"
version = "0.1.0"
description = "Public, unauthenticated MCP server exposing a single docs_query tool backed by Keboola's AI service."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
